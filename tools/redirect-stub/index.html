<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISL 홈페이지가 이전되었습니다</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://isl-cnu.github.io/">
  <meta http-equiv="refresh" content="3; url=https://isl-cnu.github.io/">
  <script>
    // 옛 Jekyll 주소를 새 VitePress 주소로 바꿔 같은 페이지로 보낸다.
    (function () {
      var NEW_ORIGIN = 'https://isl-cnu.github.io';
      var MAP = {
        '/seminar/seminar/': '/seminar/',
        '/seminar/demo/': '/seminar/demo',
        '/lecture_spring/experiments/': '/lecture/experiments',
        '/lecture_fall/programming/': '/lecture/programming',
        '/research/interests/': '/research/interests',
        '/research/project/': '/research/project',
        '/attachments/seminar/2019/20190627_AJW_stitching#3.pdf':
          '/attachments/seminar/2019/20190627_AJW_stitching3.pdf'
      };
      var path = location.pathname;
      var decoded = path;
      try { decoded = decodeURIComponent(path); } catch (e) {}
      var target = MAP[decoded] || MAP[decoded + '/'];
      target = target ? encodeURI(target) : path;
      location.replace(NEW_ORIGIN + target + location.search + location.hash);
    })();
  </script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 48px 16px; text-align: center; color: #333; background: #fff; }
    a { color: #b3141b; }
  </style>
</head>
<body>
  <p>ISL 홈페이지 주소가 바뀌었습니다.</p>
  <p><a href="https://isl-cnu.github.io/">https://isl-cnu.github.io</a> 로 이동합니다.</p>
</body>
</html>
