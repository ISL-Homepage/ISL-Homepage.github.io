# 2026년 1학기 강의
#
# 매주 공지 열기: 해당 주차의 open 을 true 로 바꾸면 됩니다.
#   false 인 공지는 학생 화면에 "공개 예정"으로 흐리게 보입니다.
# 파일 경로(file)는 public/attachments/ 기준입니다.
#   새 학기 파일은 public/attachments/lecture/<연도>-<학기>/ 에 넣는 것을 권장합니다.
#
# 공지 항목:
#   week:  주차 숫자 (선택. 없으면 목록 맨 아래에 표시)
#   title: 제목 (선택. 없으면 "N주차 실험 공지")
#   file:  첨부 파일 (선택)
#   open:  true 면 공개

year: 2026
